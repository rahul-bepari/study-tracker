<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyFlow — Session Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ─── Reset & Tokens ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #08090d;
      --bg2:      #0f1117;
      --surface:  #13161f;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);
      --green:    #00e5a0;
      --green-dim:#00e5a020;
      --blue:     #4f8eff;
      --blue-dim: #4f8eff18;
      --red:      #ff4757;
      --red-dim:  #ff475718;
      --gold:     #f5c542;
      --text:     #eef0f6;
      --muted:    #4a5270;
      --muted2:   #6b7499;
      --syne:     'Syne', sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --r:        14px;
      --r-sm:     10px;
      --shadow:   0 8px 40px rgba(0,0,0,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--syne);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Background mesh ────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 5%,  rgba(79,142,255,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 90%, rgba(0,229,160,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(245,197,66,0.025) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ─────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 100px;
    }

    /* ─── Nav / Header ───────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 0;
      margin-bottom: 48px;
      animation: fadeDown 0.5s ease both;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: var(--green);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .logo-text span { color: var(--green); }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--gold);
    }

    /* ─── Hero stat row ──────────────────────────── */
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
      animation: fadeUp 0.55s 0.1s ease both;
    }

    .stat-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 16px;
      position: relative;
      overflow: hidden;
    }

    .stat-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .stat-tile.green::before { background: var(--green); }
    .stat-tile.blue::before  { background: var(--blue); }
    .stat-tile.gold::before  { background: var(--gold); }

    .stat-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted2);
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 600;
      line-height: 1;
    }

    .stat-tile.green .stat-value { color: var(--green); }
    .stat-tile.blue  .stat-value { color: var(--blue); }
    .stat-tile.gold  .stat-value { color: var(--gold); }

    .stat-sub {
      font-size: 0.7rem;
      color: var(--muted2);
      margin-top: 4px;
    }

    /* ─── Main card ──────────────────────────────── */
    .main-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.55s 0.2s ease both;
    }

    .card-section-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted2);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Input group */
    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted2);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--border2);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: var(--syne);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 13px 14px 13px 42px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input[type="text"]::placeholder { color: var(--muted); font-weight: 400; }
    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,142,255,0.12);
    }

    input[type="text"].error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255,71,87,0.1);
      animation: shake 0.35s ease;
    }

    /* Timer display */
    .timer-section {
      text-align: center;
      padding: 28px 0 32px;
      position: relative;
    }

    .timer-ring-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }

    .timer-ring {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: var(--bg2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: relative;
      transition: border-color 0.4s;
    }

    .timer-ring.active {
      border-color: var(--green);
      box-shadow: 0 0 0 6px var(--green-dim), 0 0 40px var(--green-dim);
    }

    .timer-hms {
      font-family: var(--mono);
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    .timer-ring.active .timer-hms { color: var(--green); }

    .timer-status {
      font-family: var(--mono);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted2);
      margin-top: 4px;
    }

    .pulse-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
      animation: pulse 1.2s ease infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .timer-ring.active ~ .active-course-row .pulse-dot { opacity: 1; }

    .active-course-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
    }

    .active-course-pill {
      background: var(--blue-dim);
      border: 1px solid rgba(79,142,255,0.25);
      color: var(--blue);
      border-radius: 999px;
      padding: 4px 14px;
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Buttons */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border: none;
      border-radius: var(--r-sm);
      font-family: var(--syne);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.02em;
      -webkit-appearance: none;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    .btn-start {
      background: var(--green);
      color: #08090d;
      box-shadow: 0 4px 20px rgba(0,229,160,0.25);
    }

    .btn-start:hover:not(:disabled) { box-shadow: 0 4px 28px rgba(0,229,160,0.4); }

    .btn-finish {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 20px rgba(255,71,87,0.2);
    }

    .btn-finish:hover:not(:disabled) { box-shadow: 0 4px 28px rgba(255,71,87,0.35); }

    /* ─── Sessions log card ──────────────────────── */
    .log-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 28px 20px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.55s 0.3s ease both;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .log-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--muted2);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 0.7rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      -webkit-appearance: none;
    }

    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    /* Session items */
    .session-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 14px 16px;
      animation: fadeUp 0.3s ease both;
      transition: border-color 0.2s;
    }

    .session-item:hover { border-color: var(--border2); }

    .session-index {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      min-width: 20px;
      text-align: right;
    }

    .session-info { flex: 1; min-width: 0; }

    .session-course {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .session-time {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted2);
      margin-top: 3px;
    }

    .session-dur {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--green);
      white-space: nowrap;
      background: var(--green-dim);
      border-radius: 6px;
      padding: 4px 10px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted2);
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-text { font-size: 0.85rem; line-height: 1.6; }

    /* ─── Footer ─────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.7rem;
      animation: fadeUp 0.55s 0.4s ease both;
    }

    footer a { color: var(--muted2); text-decoration: none; }
    footer a:hover { color: var(--green); }

    /* ─── Animations ─────────────────────────────── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%       { transform: scale(1.6); opacity: 0.5; }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 520px) {
      nav { margin-bottom: 32px; }

      .hero-stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat-tile:last-child {
        grid-column: 1 / -1;
      }

      .main-card, .log-card { padding: 22px 18px; }

      .timer-ring { width: 140px; height: 140px; }
      .timer-hms  { font-size: 1.65rem; }

      .btn-grid { grid-template-columns: 1fr; }

      .stat-value { font-size: 1.3rem; }
    }

    @media (max-width: 360px) {
      .hero-stats { grid-template-columns: 1fr; }
      .stat-tile:last-child { grid-column: auto; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Nav -->
  <nav>
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Study<span>Flow</span></div>
    </div>
    <div class="streak-badge">
      🔥 <span id="streak-count">0</span> day streak
    </div>
  </nav>

  <!-- Stats row -->
  <div class="hero-stats">
    <div class="stat-tile green">
      <div class="stat-label">Today</div>
      <div class="stat-value" id="stat-today">0h 00m</div>
      <div class="stat-sub" id="stat-sessions-count">0 sessions</div>
    </div>
    <div class="stat-tile blue">
      <div class="stat-label">Sessions</div>
      <div class="stat-value" id="stat-count">0</div>
      <div class="stat-sub">completed</div>
    </div>
    <div class="stat-tile gold">
      <div class="stat-label">Best Session</div>
      <div class="stat-value" id="stat-best">—</div>
      <div class="stat-sub" id="stat-best-course">none yet</div>
    </div>
  </div>

  <!-- Main control card -->
  <div class="main-card">
    <div class="card-section-label">New Session</div>

    <div class="input-group">
      <label for="course-input">Course / Subject</label>
      <div class="input-wrap">
        <span class="input-icon">🎯</span>
        <input type="text" id="course-input"
          placeholder="e.g. CSC301 Theory of Computation"
          maxlength="60"
          autocomplete="off"/>
      </div>
    </div>

    <div class="timer-section">
      <div class="timer-ring-wrap">
        <div class="timer-ring" id="timer-ring">
          <div class="timer-hms" id="timer-display">00:00:00</div>
          <div class="timer-status" id="timer-status">ready</div>
        </div>
      </div>
      <div class="active-course-row" id="active-course-row">
        <span class="pulse-dot" id="pulse-dot"></span>
        <span class="active-course-pill" id="active-course-pill" style="display:none"></span>
      </div>
    </div>

    <div class="btn-grid">
      <button class="btn btn-start" id="btn-start">▶ Start Study</button>
      <button class="btn btn-finish" id="btn-finish" disabled>■ Finish</button>
    </div>
  </div>

  <!-- Session Log -->
  <div class="log-card">
    <div class="log-header">
      <div class="log-title">Today's Sessions</div>
      <button class="btn-clear" id="btn-clear">🗑 Clear</button>
    </div>
    <ul class="session-list" id="session-list"></ul>
  </div>

  <footer>
    Built with ❤️ by <a href="https://github.com/rahul-bepari" target="_blank">rahul-bepari</a>
    &nbsp;·&nbsp; StudyFlow v1.0
  </footer>

</div>

<script>
  /* ─── Constants ──────────────────────────────── */
  const STORAGE_KEY = 'studyflow_sessions_v2';
  const TODAY = new Date().toDateString();

  /* ─── DOM refs ───────────────────────────────── */
  const courseInput    = document.getElementById('course-input');
  const timerRing      = document.getElementById('timer-ring');
  const timerDisplay   = document.getElementById('timer-display');
  const timerStatus    = document.getElementById('timer-status');
  const activeRow      = document.getElementById('active-course-row');
  const activePill     = document.getElementById('active-course-pill');
  const pulseDot       = document.getElementById('pulse-dot');
  const btnStart       = document.getElementById('btn-start');
  const btnFinish      = document.getElementById('btn-finish');
  const sessionList    = document.getElementById('session-list');
  const btnClear       = document.getElementById('btn-clear');
  const statToday      = document.getElementById('stat-today');
  const statCount      = document.getElementById('stat-count');
  const statBest       = document.getElementById('stat-best');
  const statBestCourse = document.getElementById('stat-best-course');
  const statSessionsCount = document.getElementById('stat-sessions-count');
  const streakCount    = document.getElementById('streak-count');

  /* ─── State ──────────────────────────────────── */
  let timerInterval = null;
  let startTime     = null;

  /* ─── Utilities ──────────────────────────────── */
  const pad = n => String(n).padStart(2, '0');

  function toHMS(sec) {
    return `${pad(Math.floor(sec/3600))}:${pad(Math.floor((sec%3600)/60))}:${pad(sec%60)}`;
  }

  function toHM(sec) {
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
    return `${h}h ${pad(m)}m`;
  }

  function toDur(sec) {
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if (h > 0) return `${h}h ${pad(m)}m ${pad(s)}s`;
    if (m > 0) return `${m}m ${pad(s)}s`;
    return `${s}s`;
  }

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function esc(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ─── Storage ────────────────────────────────── */
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }

  function saveAll(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function todaySessions() {
    return loadAll().filter(s => s.date === TODAY);
  }

  function addSession(s) {
    const all = loadAll();
    all.push(s);
    saveAll(all);
    updateStreak(all);
  }

  function clearToday() {
    const all = loadAll().filter(s => s.date !== TODAY);
    saveAll(all);
  }

  /* ─── Streak ─────────────────────────────────── */
  function updateStreak(all) {
    const days = [...new Set(all.map(s => s.date))].sort();
    if (!days.length) { streakCount.textContent = '0'; return; }

    let streak = 0;
    let d = new Date();
    d.setHours(0,0,0,0);

    while (true) {
      const ds = d.toDateString();
      if (days.includes(ds)) { streak++; d.setDate(d.getDate()-1); }
      else break;
    }
    streakCount.textContent = streak;
  }

  /* ─── Render ─────────────────────────────────── */
  function render() {
    const sessions = todaySessions();
    const totalSec = sessions.reduce((a, s) => a + s.duration, 0);
    const count    = sessions.length;
    const best     = sessions.reduce((a, s) => s.duration > (a?.duration||0) ? s : a, null);

    statToday.textContent        = toHM(totalSec);
    statCount.textContent        = count;
    statSessionsCount.textContent = `${count} session${count !== 1 ? 's' : ''}`;
    statBest.textContent         = best ? toDur(best.duration) : '—';
    statBestCourse.textContent   = best ? best.course : 'none yet';

    // Streak from all-time data
    updateStreak(loadAll());

    if (!sessions.length) {
      sessionList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎓</div>
          <div class="empty-text">No sessions yet today.<br>Enter a course and hit Start!</div>
        </div>`;
      return;
    }

    sessionList.innerHTML = '';
    [...sessions].reverse().forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'session-item';
      li.innerHTML = `
        <div class="session-index">#${sessions.length - i}</div>
        <div class="session-info">
          <div class="session-course">${esc(s.course)}</div>
          <div class="session-time">${fmtTime(s.startTs)} → ${fmtTime(s.endTs)}</div>
        </div>
        <div class="session-dur">${toDur(s.duration)}</div>`;
      sessionList.appendChild(li);
    });
  }

  /* ─── Timer ──────────────────────────────────── */
  function tick() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    timerDisplay.textContent = toHMS(elapsed);
  }

  /* ─── Events ─────────────────────────────────── */
  btnStart.addEventListener('click', () => {
    const course = courseInput.value.trim();
    if (!course) {
      courseInput.classList.add('error');
      courseInput.focus();
      setTimeout(() => courseInput.classList.remove('error'), 800);
      return;
    }

    startTime = Date.now();
    timerInterval = setInterval(tick, 500);

    timerRing.classList.add('active');
    timerStatus.textContent = 'studying';
    activePill.textContent  = course;
    activePill.style.display = '';
    pulseDot.style.opacity   = '1';

    btnStart.disabled        = true;
    btnFinish.disabled       = false;
    courseInput.disabled     = true;
  });

  btnFinish.addEventListener('click', () => {
    clearInterval(timerInterval);
    timerInterval = null;

    const endTs    = Date.now();
    const duration = Math.max(1, Math.floor((endTs - startTime) / 1000));

    addSession({
      course:   courseInput.value.trim(),
      startTs,
      endTs,
      duration,
      date: TODAY
    });

    // Reset UI
    timerDisplay.textContent = '00:00:00';
    timerRing.classList.remove('active');
    timerStatus.textContent  = 'ready';
    activePill.style.display = 'none';
    pulseDot.style.opacity   = '0';
    btnStart.disabled        = false;
    btnFinish.disabled       = true;
    courseInput.disabled     = false;
    courseInput.value        = '';
    startTime                = null;

    render();
  });

  btnClear.addEventListener('click', () => {
    if (confirm('Clear all of today\'s sessions?')) {
      clearToday();
      render();
    }
  });

  courseInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btnStart.disabled) btnStart.click();
  });

  /* ─── Init ───────────────────────────────────── */
  render();
</script>
</body>
</html>
