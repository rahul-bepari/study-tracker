<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#08090d" id="meta-theme"/>
  <title>StudyFlow — Session Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    /* ══════════════════════════════════════════
       TOKENS — Dark Theme (default)
    ══════════════════════════════════════════ */
    :root,
    [data-theme="dark"] {
      --bg:          #08090d;
      --bg2:         #0f1117;
      --surface:     #13161f;
      --surface2:    #1a1e2b;
      --border:      rgba(255,255,255,0.07);
      --border2:     rgba(255,255,255,0.13);
      --green:       #00e5a0;
      --green-dim:   rgba(0,229,160,0.12);
      --blue:        #4f8eff;
      --blue-dim:    rgba(79,142,255,0.12);
      --red:         #ff4757;
      --red-dim:     rgba(255,71,87,0.12);
      --gold:        #f5c542;
      --gold-dim:    rgba(245,197,66,0.12);
      --text:        #eef0f6;
      --text2:       #9ba3c0;
      --muted:       #3e4563;
      --muted2:      #606889;
      --shadow:      0 8px 40px rgba(0,0,0,0.55);
      --shadow-sm:   0 2px 12px rgba(0,0,0,0.35);
      --mesh1:       rgba(79,142,255,0.06);
      --mesh2:       rgba(0,229,160,0.06);
      --toggle-bg:   #1a1e2b;
      --toggle-icon: "☀️";
      --input-bg:    #0a0b10;
    }

    /* ══════════════════════════════════════════
       TOKENS — Light Theme
    ══════════════════════════════════════════ */
    [data-theme="light"] {
      --bg:          #f0f4ff;
      --bg2:         #e8edf8;
      --surface:     #ffffff;
      --surface2:    #f5f7fe;
      --border:      rgba(0,0,0,0.07);
      --border2:     rgba(0,0,0,0.13);
      --green:       #00b87a;
      --green-dim:   rgba(0,184,122,0.10);
      --blue:        #2e6fe8;
      --blue-dim:    rgba(46,111,232,0.10);
      --red:         #e8333f;
      --red-dim:     rgba(232,51,63,0.10);
      --gold:        #c99b00;
      --gold-dim:    rgba(201,155,0,0.10);
      --text:        #111827;
      --text2:       #4b5470;
      --muted:       #b0b8d4;
      --muted2:      #7b84a0;
      --shadow:      0 8px 40px rgba(60,80,180,0.10);
      --shadow-sm:   0 2px 12px rgba(60,80,180,0.07);
      --mesh1:       rgba(46,111,232,0.07);
      --mesh2:       rgba(0,184,122,0.07);
      --toggle-bg:   #e2e8f8;
      --toggle-icon: "🌙";
      --input-bg:    #f5f7fe;
    }

    /* ══════════════════════════════════════════
       RESET
    ══════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* mesh background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 10% 5%,  var(--mesh1) 0%, transparent 65%),
        radial-gradient(ellipse 60% 50% at 90% 95%, var(--mesh2) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s;
    }

    /* ══════════════════════════════════════════
       LAYOUT
    ══════════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 clamp(14px, 4vw, 28px) clamp(60px, 10vh, 100px);
    }

    /* ══════════════════════════════════════════
       NAV
    ══════════════════════════════════════════ */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: clamp(20px, 4vw, 32px);
      margin-bottom: clamp(24px, 5vw, 44px);
      animation: fadeDown 0.5s ease both;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: clamp(30px,7vw,38px);
      height: clamp(30px,7vw,38px);
      background: var(--green);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: clamp(14px, 3.5vw, 18px);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .logo-text {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      transition: color 0.3s;
    }

    .logo-text span { color: var(--green); transition: color 0.3s; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 999px;
      padding: 5px clamp(8px,2.5vw,14px);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.65rem, 2vw, 0.75rem);
      color: var(--gold);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
      white-space: nowrap;
    }

    /* Theme toggle */
    .theme-toggle {
      width: clamp(34px,8vw,40px);
      height: clamp(34px,8vw,40px);
      background: var(--toggle-bg);
      border: 1px solid var(--border2);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: clamp(14px,3.5vw,17px);
      transition: background 0.3s, border-color 0.3s, transform 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .theme-toggle:hover  { transform: scale(1.08); }
    .theme-toggle:active { transform: scale(0.93); }

    /* ══════════════════════════════════════════
       HERO STATS
    ══════════════════════════════════════════ */
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vw, 14px);
      margin-bottom: clamp(16px, 3vw, 24px);
      animation: fadeUp 0.55s 0.1s ease both;
    }

    .stat-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: clamp(10px, 2.5vw, 16px);
      padding: clamp(14px, 3vw, 20px) clamp(12px, 2.5vw, 18px);
      position: relative;
      overflow: hidden;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.2s;
    }

    .stat-tile:hover { box-shadow: var(--shadow-sm); }

    .stat-tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2.5px;
      border-radius: 2px;
    }

    .stat-tile.green::before { background: var(--green); }
    .stat-tile.blue::before  { background: var(--blue); }
    .stat-tile.gold::before  { background: var(--gold); }

    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.58rem, 1.8vw, 0.68rem);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted2);
      margin-bottom: 6px;
      transition: color 0.3s;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.1rem, 3.5vw, 1.85rem);
      font-weight: 600;
      line-height: 1;
      transition: color 0.3s;
    }

    .stat-tile.green .stat-value { color: var(--green); }
    .stat-tile.blue  .stat-value { color: var(--blue); }
    .stat-tile.gold  .stat-value { color: var(--gold); }

    .stat-sub {
      font-size: clamp(0.62rem, 1.8vw, 0.72rem);
      color: var(--muted2);
      margin-top: 4px;
      transition: color 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ══════════════════════════════════════════
       CARDS
    ══════════════════════════════════════════ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: clamp(14px, 3vw, 22px);
      padding: clamp(20px, 5vw, 34px) clamp(18px, 5vw, 32px);
      margin-bottom: clamp(14px, 3vw, 22px);
      box-shadow: var(--shadow);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted2);
      margin-bottom: clamp(16px, 3vw, 22px);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color 0.3s;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      transition: background 0.3s;
    }

    /* ══════════════════════════════════════════
       INPUT
    ══════════════════════════════════════════ */
    .input-group { margin-bottom: clamp(18px, 4vw, 26px); }

    .input-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted2);
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
      line-height: 1;
    }

    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.88rem, 2.5vw, 1rem);
      font-weight: 600;
      padding: clamp(11px,2.5vw,14px) 14px clamp(11px,2.5vw,14px) 40px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]::placeholder { color: var(--muted2); font-weight: 400; }

    input[type="text"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-dim);
    }

    input[type="text"].error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-dim);
      animation: shake 0.35s ease;
    }

    /* ══════════════════════════════════════════
       TIMER
    ══════════════════════════════════════════ */
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(16px, 4vw, 28px) 0 clamp(20px, 4vw, 30px);
    }

    .timer-ring {
      width: clamp(130px, 35vw, 168px);
      height: clamp(130px, 35vw, 168px);
      border-radius: 50%;
      background: var(--bg2);
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: border-color 0.4s, box-shadow 0.4s, background 0.3s;
      margin-bottom: 14px;
    }

    .timer-ring.active {
      border-color: var(--green);
      box-shadow: 0 0 0 7px var(--green-dim), 0 0 44px var(--green-dim);
    }

    .timer-hms {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      transition: color 0.3s;
    }

    .timer-ring.active .timer-hms { color: var(--green); }

    .timer-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.55rem, 1.8vw, 0.62rem);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted2);
      margin-top: 5px;
      transition: color 0.3s;
    }

    .active-course-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 30px;
    }

    .pulse-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      opacity: 0;
      animation: pulse 1.3s ease infinite;
      transition: opacity 0.3s, background 0.3s;
      flex-shrink: 0;
    }

    .active-course-pill {
      background: var(--blue-dim);
      border: 1px solid rgba(79,142,255,0.2);
      color: var(--blue);
      border-radius: 999px;
      padding: 4px clamp(10px,3vw,16px);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 600;
      max-width: min(260px, 72vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }

    /* ══════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════ */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 2vw, 14px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: clamp(12px,3vw,15px) 16px;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.82rem, 2.3vw, 0.93rem);
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active:not(:disabled) { transform: scale(0.96); }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-start {
      background: var(--green);
      color: #08090d;
      box-shadow: 0 4px 18px var(--green-dim);
    }

    [data-theme="light"] .btn-start { color: #fff; }

    .btn-start:hover:not(:disabled) {
      box-shadow: 0 4px 28px rgba(0,229,160,0.35);
    }

    [data-theme="light"] .btn-start:hover:not(:disabled) {
      box-shadow: 0 4px 28px rgba(0,184,122,0.3);
    }

    .btn-finish {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 18px var(--red-dim);
    }

    .btn-finish:hover:not(:disabled) {
      box-shadow: 0 4px 28px rgba(255,71,87,0.35);
    }

    /* ══════════════════════════════════════════
       SESSION LOG
    ══════════════════════════════════════════ */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(14px, 3vw, 20px);
      gap: 10px;
    }

    .log-title {
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      transition: color 0.3s;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--muted2);
      border-radius: 8px;
      padding: 6px clamp(8px,2vw,14px);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.65rem, 1.8vw, 0.72rem);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.3s;
      white-space: nowrap;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    .session-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(7px, 1.8vw, 10px);
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2.5vw, 16px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: clamp(8px, 2vw, 12px);
      padding: clamp(11px,2.5vw,14px) clamp(12px,3vw,18px);
      animation: fadeUp 0.3s ease both;
      transition: border-color 0.2s, background 0.3s;
    }

    .session-item:hover { border-color: var(--border2); }

    .session-index {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.62rem, 1.8vw, 0.72rem);
      color: var(--muted2);
      min-width: 18px;
      text-align: right;
      transition: color 0.3s;
    }

    .session-info { flex: 1; min-width: 0; }

    .session-course {
      font-weight: 700;
      font-size: clamp(0.82rem, 2.4vw, 0.94rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      transition: color 0.3s;
    }

    .session-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.6rem, 1.7vw, 0.69rem);
      color: var(--muted2);
      margin-top: 3px;
      transition: color 0.3s;
    }

    .session-dur {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.72rem, 2vw, 0.82rem);
      font-weight: 600;
      color: var(--green);
      white-space: nowrap;
      background: var(--green-dim);
      border-radius: 7px;
      padding: 4px clamp(7px,2vw,11px);
      transition: color 0.3s, background 0.3s;
    }

    .empty-state {
      text-align: center;
      padding: clamp(28px,6vw,44px) 20px;
      color: var(--muted2);
      transition: color 0.3s;
    }

    .empty-icon { font-size: clamp(2rem, 6vw, 2.8rem); margin-bottom: 10px; }

    .empty-text {
      font-size: clamp(0.8rem, 2.2vw, 0.87rem);
      line-height: 1.7;
    }

    /* ══════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════ */
    footer {
      text-align: center;
      margin-top: clamp(32px, 6vw, 52px);
      color: var(--muted2);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.62rem, 1.8vw, 0.7rem);
      animation: fadeUp 0.55s 0.4s ease both;
      transition: color 0.3s;
    }

    footer a {
      color: var(--muted2);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--green); }

    /* ══════════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════════ */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%,100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.7); opacity: 0.4; }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }

    /* ══════════════════════════════════════════
       RESPONSIVE BREAKPOINTS
    ══════════════════════════════════════════ */

    /* Tablet portrait & smaller (≤600px) */
    @media (max-width: 600px) {
      .hero-stats {
        grid-template-columns: 1fr 1fr;
      }
      .stat-tile:last-child {
        grid-column: 1 / -1;
      }
      .stat-tile:last-child .stat-value {
        font-size: 1.3rem;
      }
    }

    /* Phone (≤420px) */
    @media (max-width: 420px) {
      .hero-stats {
        grid-template-columns: 1fr 1fr;
      }
      .btn-grid {
        grid-template-columns: 1fr;
      }
      .streak-badge {
        display: none; /* hide on very small to keep nav clean */
      }
    }

    /* Very small phones (≤340px) */
    @media (max-width: 340px) {
      .hero-stats {
        grid-template-columns: 1fr;
      }
      .stat-tile:last-child {
        grid-column: auto;
      }
    }

    /* Large screens / tablets landscape */
    @media (min-width: 768px) {
      .btn-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Safe area (notch phones) */
    @supports (padding: env(safe-area-inset-bottom)) {
      body {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- ── Nav ── -->
  <nav>
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Study<span>Flow</span></div>
    </div>
    <div class="nav-right">
      <div class="streak-badge">🔥 <span id="streak-count">0</span> day streak</div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </nav>

  <!-- ── Stats ── -->
  <div class="hero-stats" role="region" aria-label="Today's statistics">
    <div class="stat-tile green">
      <div class="stat-label">Today</div>
      <div class="stat-value" id="stat-today">0h 00m</div>
      <div class="stat-sub" id="stat-sessions-count">0 sessions</div>
    </div>
    <div class="stat-tile blue">
      <div class="stat-label">Sessions</div>
      <div class="stat-value" id="stat-count">0</div>
      <div class="stat-sub">completed</div>
    </div>
    <div class="stat-tile gold">
      <div class="stat-label">Best</div>
      <div class="stat-value" id="stat-best">—</div>
      <div class="stat-sub" id="stat-best-course">none yet</div>
    </div>
  </div>

  <!-- ── Main Control Card ── -->
  <div class="card" style="animation: fadeUp 0.55s 0.2s ease both;">
    <div class="section-label">New Session</div>

    <div class="input-group">
      <label for="course-input">Course / Subject</label>
      <div class="input-wrap">
        <span class="input-icon">🎯</span>
        <input type="text" id="course-input"
          placeholder="e.g. CSC301 Theory of Computation"
          maxlength="60"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"/>
      </div>
    </div>

    <div class="timer-section">
      <div class="timer-ring" id="timer-ring">
        <div class="timer-hms" id="timer-display">00:00:00</div>
        <div class="timer-status" id="timer-status">ready</div>
      </div>
      <div class="active-course-row">
        <span class="pulse-dot" id="pulse-dot"></span>
        <span class="active-course-pill" id="active-course-pill" style="display:none"></span>
      </div>
    </div>

    <div class="btn-grid">
      <button class="btn btn-start" id="btn-start">▶ Start Study</button>
      <button class="btn btn-finish" id="btn-finish" disabled>■ Finish</button>
    </div>
  </div>

  <!-- ── Session Log ── -->
  <div class="card" style="animation: fadeUp 0.55s 0.3s ease both;">
    <div class="log-header">
      <div class="log-title">Today's Sessions</div>
      <button class="btn-clear" id="btn-clear">🗑 Clear all</button>
    </div>
    <ul class="session-list" id="session-list"></ul>
  </div>

  <footer>
    Built by <a href="https://github.com/rahul-bepari" target="_blank" rel="noopener">rahul-bepari</a>
    &nbsp;·&nbsp; StudyFlow v2.0 &nbsp;·&nbsp; Data stays on your device
  </footer>

</div>

<script>
  /* ═══════════════════════════════════════
     CONSTANTS & STORAGE KEY
  ═══════════════════════════════════════ */
  const STORAGE_KEY  = 'studyflow_sessions_v2';
  const THEME_KEY    = 'studyflow_theme';
  const TODAY        = new Date().toDateString();

  /* ═══════════════════════════════════════
     DOM REFS
  ═══════════════════════════════════════ */
  const html           = document.documentElement;
  const metaTheme      = document.getElementById('meta-theme');
  const themeToggle    = document.getElementById('theme-toggle');
  const themeIcon      = document.getElementById('theme-icon');
  const courseInput    = document.getElementById('course-input');
  const timerRing      = document.getElementById('timer-ring');
  const timerDisplay   = document.getElementById('timer-display');
  const timerStatus    = document.getElementById('timer-status');
  const activePill     = document.getElementById('active-course-pill');
  const pulseDot       = document.getElementById('pulse-dot');
  const btnStart       = document.getElementById('btn-start');
  const btnFinish      = document.getElementById('btn-finish');
  const sessionList    = document.getElementById('session-list');
  const btnClear       = document.getElementById('btn-clear');
  const statToday      = document.getElementById('stat-today');
  const statCount      = document.getElementById('stat-count');
  const statBest       = document.getElementById('stat-best');
  const statBestCourse = document.getElementById('stat-best-course');
  const statSessions   = document.getElementById('stat-sessions-count');
  const streakCount    = document.getElementById('streak-count');

  /* ═══════════════════════════════════════
     THEME
  ═══════════════════════════════════════ */
  function applyTheme(theme) {
    html.setAttribute('data-theme', theme);
    // Update meta theme-color
    metaTheme.setAttribute('content', theme === 'dark' ? '#08090d' : '#f0f4ff');
    // Update toggle icon
    themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(THEME_KEY, theme);
  }

  // Load saved theme or prefer system
  (function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) {
      applyTheme(saved);
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }
  })();

  themeToggle.addEventListener('click', () => {
    const current = html.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // Also watch system preference change
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem(THEME_KEY)) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });

  /* ═══════════════════════════════════════
     UTILITIES
  ═══════════════════════════════════════ */
  const pad  = n => String(n).padStart(2, '0');

  function toHMS(sec) {
    return `${pad(Math.floor(sec/3600))}:${pad(Math.floor((sec%3600)/60))}:${pad(sec%60)}`;
  }

  function toHM(sec) {
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
    return `${h}h ${pad(m)}m`;
  }

  function toDur(sec) {
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if (h > 0) return `${h}h ${pad(m)}m ${pad(s)}s`;
    if (m > 0) return `${m}m ${pad(s)}s`;
    return `${s}s`;
  }

  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function esc(str) {
    return str.replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ═══════════════════════════════════════
     STORAGE
  ═══════════════════════════════════════ */
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }

  function saveAll(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function todaySessions() {
    return loadAll().filter(s => s.date === TODAY);
  }

  function addSession(s) {
    const all = loadAll();
    all.push(s);
    saveAll(all);
  }

  function clearToday() {
    saveAll(loadAll().filter(s => s.date !== TODAY));
  }

  /* ═══════════════════════════════════════
     STREAK
  ═══════════════════════════════════════ */
  function calcStreak(all) {
    const days = [...new Set(all.map(s => s.date))];
    let streak = 0;
    let d = new Date();
    d.setHours(0,0,0,0);
    while (days.includes(d.toDateString())) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  /* ═══════════════════════════════════════
     RENDER
  ═══════════════════════════════════════ */
  function render() {
    const sessions = todaySessions();
    const totalSec = sessions.reduce((a, s) => a + s.duration, 0);
    const count    = sessions.length;
    const best     = sessions.reduce((a, s) => (!a || s.duration > a.duration) ? s : a, null);
    const streak   = calcStreak(loadAll());

    statToday.textContent        = toHM(totalSec);
    statCount.textContent        = count;
    statSessions.textContent     = `${count} session${count !== 1 ? 's' : ''}`;
    statBest.textContent         = best ? toDur(best.duration) : '—';
    statBestCourse.textContent   = best ? best.course : 'none yet';
    streakCount.textContent      = streak;

    if (!sessions.length) {
      sessionList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎓</div>
          <div class="empty-text">No sessions yet today.<br>Enter a course and hit <strong>Start</strong>!</div>
        </div>`;
      return;
    }

    sessionList.innerHTML = '';
    [...sessions].reverse().forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'session-item';
      li.innerHTML = `
        <div class="session-index">#${sessions.length - i}</div>
        <div class="session-info">
          <div class="session-course">${esc(s.course)}</div>
          <div class="session-time">${fmtTime(s.startTs)} → ${fmtTime(s.endTs)}</div>
        </div>
        <div class="session-dur">${toDur(s.duration)}</div>`;
      sessionList.appendChild(li);
    });
  }

  /* ═══════════════════════════════════════
     TIMER
  ═══════════════════════════════════════ */
  let timerInterval = null;
  let startTime     = null;

  function tick() {
    timerDisplay.textContent = toHMS(Math.floor((Date.now() - startTime) / 1000));
  }

  /* ═══════════════════════════════════════
     EVENTS
  ═══════════════════════════════════════ */
  btnStart.addEventListener('click', () => {
    const course = courseInput.value.trim();
    if (!course) {
      courseInput.classList.add('error');
      courseInput.focus();
      setTimeout(() => courseInput.classList.remove('error'), 900);
      return;
    }

    startTime     = Date.now();
    timerInterval = setInterval(tick, 500);

    timerRing.classList.add('active');
    timerStatus.textContent  = 'studying…';
    activePill.textContent   = course;
    activePill.style.display = '';
    pulseDot.style.opacity   = '1';

    btnStart.disabled    = true;
    btnFinish.disabled   = false;
    courseInput.disabled = true;
  });

  btnFinish.addEventListener('click', () => {
    clearInterval(timerInterval);
    timerInterval = null;

    const endTs    = Date.now();
    const duration = Math.max(1, Math.floor((endTs - startTime) / 1000));

    addSession({ course: courseInput.value.trim(), startTs: startTime, endTs, duration, date: TODAY });

    // reset UI
    timerDisplay.textContent = '00:00:00';
    timerRing.classList.remove('active');
    timerStatus.textContent  = 'ready';
    activePill.style.display = 'none';
    pulseDot.style.opacity   = '0';
    btnStart.disabled        = false;
    btnFinish.disabled       = true;
    courseInput.disabled     = false;
    courseInput.value        = '';
    startTime                = null;

    render();
  });

  btnClear.addEventListener('click', () => {
    if (confirm("Clear all of today's study sessions?")) {
      clearToday();
      render();
    }
  });

  // Enter key to start
  courseInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btnStart.disabled) btnStart.click();
  });

  /* ═══════════════════════════════════════
     INIT
  ═══════════════════════════════════════ */
  render();
</script>
</body>
</html>
